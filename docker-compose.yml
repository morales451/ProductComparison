version: '3.8'

services:
  roofspec-matcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roofspec-matcher
    ports:
      - "8501:8501"
    environment:
      # Load from .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Optional: Mount app.py for development (comment out for production)
      # - ./app.py:/app/app.py
      # Optional: Persist uploaded files (uncomment if needed)
      # - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# Optional: Add a reverse proxy for HTTPS
